  .hov-op{transition:opacity .15s,transform .15s}

  .row-hov:hover{background:var(--content-bg)}
  .kg-node{transition:all .2s}
  input:focus,textarea:focus{border-color:var(--primary)!important;background:#fff!important}

function langSwitcher(V, big){

  const pad=big?'5px 12px':'4px 10px', radius=big?'6px':'5px';

}

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px"><div style="background:${V.contentBg};border-radius:10px;padding:11px"><div style="font-size:10px;color:${V.mutedColor};text-transform:uppercase;letter-spacing:0.4px;margin-bottom:4px">${V.t.timeSpent}</div><div style="font-size:15px;font-weight:700;color:${V.textColor}">${V.selNode.time}</div></div><div style="background:${V.contentBg};border-radius:10px;padding:11px"><div style="font-size:10px;color:${V.mutedColor};text-transform:uppercase;letter-spacing:0.4px;margin-bottom:4px">${V.t.connections}</div><div style="font-size:15px;font-weight:700;color:${V.textColor}">${V.selNode.conns}</div></div></div>
      <p style="font-size:11.5px;font-weight:600;color:${V.mutedColor};margin-bottom:7px;text-transform:uppercase;letter-spacing:0.4px">${V.t.subtopics}</p><div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px">${V.selNode.topics.map(tp=>`<span style="font-size:12px;padding:4px 10px;border-radius:6px;background:${V.kgNodeColor}1A;color:${V.kgNodeColor};font-weight:500">${tp}</span>`).join('')}</div>
      <p style="font-size:11.5px;font-weight:600;color:${V.mutedColor};margin-bottom:7px;text-transform:uppercase;letter-spacing:0.4px">${V.t.nextTopics}</p><div style="display:flex;flex-wrap:wrap;gap:5px">${V.selNode.next.map(nx=>`<span style="font-size:12px;padding:4px 10px;border-radius:6px;border:1.5px dashed ${V.borderColor};color:${V.mutedColor};font-weight:500">+ ${nx}</span>`).join('')}</div>
    </div>`
  : `<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;color:${V.mutedColor}"><div style="font-size:36px;margin-bottom:12px">🕸️</div><p style="font-size:14px;font-weight:500;color:${V.textColor};margin-bottom:6px">${V.t.kgSelectNode}</p><p style="font-size:12.5px;line-height:1.5">${V.t.kgSelectNodeSub}</p></div>`;
  return `<div style="display:grid;grid-template-columns:1fr 300px;gap:16px;height:calc(100vh - 114px)">
    <div style="background:${V.cardBg};border-radius:14px;border:1px solid ${V.borderColor};padding:20px;display:flex;flex-direction:column;overflow:hidden">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-shrink:0"><div><h3 style="font-size:14px;font-weight:600;color:${V.textColor}">${V.t.knowledgeTitle}</h3><p style="font-size:12px;color:${V.mutedColor};margin-top:2px">${V.t.knowledgeSub}</p></div><div style="display:flex;gap:14px"><div style="display:flex;align-items:center;gap:5px"><div style="width:9px;height:9px;border-radius:50%;background:${V.successColor}"></div><span style="font-size:11px;color:${V.mutedColor}">80%+</span></div><div style="display:flex;align-items:center;gap:5px"><div style="width:9px;height:9px;border-radius:50%;background:${V.warningColor}"></div><span style="font-size:11px;color:${V.mutedColor}">60%+</span></div><div style="display:flex;align-items:center;gap:5px"><div style="width:9px;height:9px;border-radius:50%;background:${V.dangerColor}"></div><span style="font-size:11px;color:${V.mutedColor}">&lt;60%</span></div></div></div>
      <div style="flex:1;overflow:hidden">${V.kgSvgEl}</div>
    </div>
    <div style="background:${V.cardBg};border-radius:14px;border:1px solid ${V.borderColor};padding:20px;overflow-y:auto">${details}</div>
  </div>`;
}

function pageTeacher(V){
  return `<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px">
    ${V.teacherStats.map(ts=>`<div style="background:${V.cardBg};border-radius:14px;padding:18px;border:1px solid ${V.borderColor}"><div style="font-size:26px;font-weight:700;color:${ts.color};letter-spacing:-0.8px;margin-bottom:4px">${ts.value}</div><div style="font-size:12.5px;color:${V.mutedColor}">${ts.label}</div></div>`).join('')}
  </div>
  <div style="background:${V.cardBg};border-radius:14px;border:1px solid ${V.borderColor};overflow:hidden"><div style="padding:16px 20px;border-bottom:1px solid ${V.borderColor};display:flex;align-items:center;justify-content:space-between"><h3 style="font-size:14px;font-weight:600;color:${V.textColor}">${V.t.studentList}</h3><span style="font-size:12.5px;color:${V.mutedColor}">6 ${V.t.students}</span></div>
    <table style="width:100%;border-collapse:collapse"><thead><tr style="background:${V.contentBg}">
      ${[V.t.name,V.t.todayStudy,'SDL',V.t.score,V.t.risk].map(h=>`<th style="padding:10px 20px;text-align:left;font-size:11.5px;font-weight:600;color:${V.mutedColor};text-transform:uppercase;letter-spacing:0.4px">${h}</th>`).join('')}
    </tr></thead><tbody>
      ${V.students.map(s=>`<tr class="row-hov" style="border-top:1px solid ${V.borderColor}"><td style="padding:12px 20px"><div style="display:flex;align-items:center;gap:10px"><div style="width:30px;height:30px;border-radius:8px;background:${s.avatarBg};display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff">${s.initial}</div><span style="font-size:13.5px;font-weight:500;color:${V.textColor}">${s.name}</span></div></td><td style="padding:12px 20px;font-size:13.5px;color:${V.textColor}">${s.today}</td><td style="padding:12px 20px"><div style="display:flex;align-items:center;gap:8px"><div style="width:48px;height:4px;background:${V.borderColor};border-radius:999px;overflow:hidden"><div style="height:100%;width:${s.sdlPct}%;background:${s.sdlColor};border-radius:999px"></div></div><span style="font-size:13px;font-weight:600;color:${s.sdlColor}">${s.sdl}</span></div></td><td style="padding:12px 20px;font-size:13.5px;font-weight:600;color:${V.textColor}">${s.score}%</td><td style="padding:12px 20px"><span style="font-size:12px;font-weight:600;color:${s.riskColor};background:${s.riskBg};padding:3px 10px;border-radius:999px">${s.riskLabel}</span></td></tr>`).join('')}
    </tbody></table>
  </div>`;
}

function pageScreenTime(V){
  return `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px">
    ${V.timeCards.map(tc=>`<div style="background:${V.cardBg};border-radius:14px;padding:20px;border:1px solid ${V.borderColor}"><div style="display:flex;align-items:center;gap:9px;margin-bottom:12px"><div style="width:32px;height:32px;border-radius:9px;background:${tc.iconBg};display:flex;align-items:center;justify-content:center;font-size:15px">${tc.icon}</div><span style="font-size:12px;font-weight:600;color:${V.mutedColor};text-transform:uppercase;letter-spacing:0.4px">${tc.label}</span></div><div style="font-size:26px;font-weight:700;color:${tc.color};letter-spacing:-0.5px">${tc.value}</div><div style="font-size:12px;color:${V.mutedColor};margin-top:4px">${tc.sub}</div></div>`).join('')}
  </div>
  <div style="display:grid;grid-template-columns:1.5fr 1fr;gap:16px">
    <div style="background:${V.cardBg};border-radius:14px;padding:20px;border:1px solid ${V.borderColor}"><h3 style="font-size:14px;font-weight:600;color:${V.textColor};margin-bottom:16px">${V.t.appBreakdown}</h3><div style="display:flex;flex-direction:column;gap:12px">
      ${V.screenApps.map(a=>`<div><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px"><div style="display:flex;align-items:center;gap:9px"><span style="font-size:16px">${a.icon}</span><span style="font-size:13.5px;font-weight:500;color:${V.textColor}">${a.name}</span><span style="font-size:11px;font-weight:600;color:${a.typeColor};background:${a.typeBg};padding:2px 7px;border-radius:999px">${a.typeLabel}</span></div><span style="font-size:13px;font-weight:600;color:${V.textColor}">${a.timeLabel}</span></div><div style="height:5px;background:${V.borderColor};border-radius:999px;overflow:hidden"><div style="height:100%;width:${a.pct}%;background:${a.barColor};border-radius:999px"></div></div></div>`).join('')}
    </div></div>
    <div style="background:${V.cardBg};border-radius:14px;padding:20px;border:1px solid ${V.borderColor};display:flex;flex-direction:column;align-items:center"><h3 style="font-size:14px;font-weight:600;color:${V.textColor};margin-bottom:16px;align-self:flex-start">${V.t.timeDistribution}</h3>${V.donutChartEl}<div style="display:flex;flex-direction:column;gap:8px;margin-top:16px;align-self:stretch">
      ${V.donutLegend.map(l=>`<div style="display:flex;align-items:center;justify-content:space-between"><div style="display:flex;align-items:center;gap:7px"><div style="width:8px;height:8px;border-radius:50%;background:${l.color}"></div><span style="font-size:13px;color:${V.textColor}">${l.label}</span></div><span style="font-size:13px;font-weight:600;color:${l.color}">${l.pct}%</span></div>`).join('')}
    </div></div>
  </div>`;
}

function tplApp(V){
  const nav = V.navItems.map(n=>`<button class="nav-btn" data-action="nav" data-screen="${n.id}" style="display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:9px;${n.active?`background:${V.navActiveBg};`:''}"><span style="color:${n.active?V.navActiveText:V.navInactiveText};display:flex;align-items:center;flex-shrink:0">${n.iconEl}</span><span style="font-size:13.5px;font-weight:${n.active?'600':'400'};color:${n.active?V.navActiveText:V.navInactiveText}">${n.label}</span></button>`).join('');
  let page='';
  switch(V.screen){
    case 'dashboard': page=pageDashboard(V);break;
    case 'sdl': page=pageSDL(V);break;
    case 'ai': page=pageAI(V);break;
    case 'knowledge': page=pageKnowledge(V);break;
    case 'teacher': page=pageTeacher(V);break;
    case 'screentime': page=pageScreenTime(V);break;
    default: page=pageDashboard(V);
  }
  return `<div style="display:flex;height:100vh;overflow:hidden;background:${V.contentBg}">
    <div style="width:240px;background:${V.sidebarBg};display:flex;flex-direction:column;border-right:1px solid ${V.sidebarDivColor};flex-shrink:0">
      <div style="padding:18px 16px;border-bottom:1px solid ${V.sidebarDivColor};display:flex;align-items:center;gap:10px"><div style="width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,${V.PC},${V.PC}BB);display:flex;align-items:center;justify-content:center;flex-shrink:0"><span style="font-size:11px;font-weight:800;color:#fff">PLN</span></div><div><div style="font-size:13.5px;font-weight:700;color:${V.sidebarTextHigh};letter-spacing:-0.3px">PLN</div><div style="font-size:10.5px;color:${V.sidebarTextLow}">Learning Network</div></div></div>
      <div style="flex:1;padding:10px 8px;overflow-y:auto;display:flex;flex-direction:column;gap:1px">${nav}</div>
      <div style="padding:12px 10px;border-top:1px solid ${V.sidebarDivColor}"><div style="display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:10px"><div style="width:32px;height:32px;border-radius:9px;background:${V.PC};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0">${V.userInitial}</div><div style="min-width:0"><div style="font-size:13px;font-weight:600;color:${V.sidebarTextHigh};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${V.userName}</div><div style="font-size:11px;color:${V.sidebarTextLow}">${V.roleLabel}</div></div></div><button data-action="logout" style="width:100%;margin-top:3px;padding:7px 10px;border-radius:8px;font-size:12.5px;color:${V.sidebarTextLow};text-align:left">${V.t.logout}</button></div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0">
      <div style="height:58px;background:${V.cardBg};border-bottom:1px solid ${V.borderColor};display:flex;align-items:center;padding:0 24px;gap:14px;flex-shrink:0"><h2 style="flex:1;font-size:15.5px;font-weight:600;color:${V.textColor};letter-spacing:-0.3px">${V.currentPageTitle}</h2><div style="display:flex;gap:2px;background:${V.contentBg};border-radius:7px;padding:3px">${langSwitcher(V,false)}</div><button style="width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:${V.mutedColor};position:relative">${BELL}<span style="position:absolute;top:7px;right:7px;width:7px;height:7px;background:${V.dangerColor};border-radius:50%;border:2px solid ${V.cardBg}"></span></button><div style="width:34px;height:34px;border-radius:10px;background:${V.PC};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff">${V.userInitial}</div></div>
      <div style="flex:1;overflow-y:auto;padding:28px;animation:fadeIn .3s ease" id="pln-page">${page}</div>
    </div>
  </div>`;
}

// ═══════════════════ RENDER ═══════════════════
function render(){
  const V = computeVals();
  const th = getTheme();
  const r = document.documentElement.style;
  r.setProperty('--primary', th.primary);
  r.setProperty('--content-bg', th.contentBg);
  r.setProperty('--nav-hover', th.navHoverBg);
  let html;
  if(V.screen==='login') html=tplLogin(V);
  else if(V.screen==='consent') html=tplConsent(V);
  else if(V.screen==='vark') html=tplVark(V);
  else html=tplApp(V);
  document.getElementById('root').innerHTML = html;
  if(V.screen==='ai'){ const c=document.getElementById('pln-chat'); if(c) c.scrollTop=c.scrollHeight; }
}

function sendChat(){
  const msg=(state.chatInput||'').trim();
  if(!msg||state.isAITyping) return;
  const lang=getLang();
  state.chatMessages=[...state.chatMessages,{type:'user',text:msg,time:timeNow()}];
  state.chatInput=''; state.isAITyping=true; render();
  setTimeout(()=>{
    state.chatMessages=[...state.chatMessages,{type:'ai',text:getAIReply(msg,lang),time:timeNow()}];
    state.isAITyping=false; render();
  }, 1000+Math.random()*800);
}

// ═══════════════════ EVENTS (delegation) ═══════════════════
document.addEventListener('click', e=>{
  const nodeEl = e.target.closest('[data-node]');
  if(nodeEl){ const id=nodeEl.dataset.node; state.selectedKgNode = state.selectedKgNode===id?null:id; render(); return; }
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const a = el.dataset.action;
  switch(a){
    case 'lang': state.lang=el.dataset.lang; render(); break;
    case 'role': state.role=el.dataset.role; render(); break;
    case 'login': if(state.role){ state.screen = state.role==='student'?'consent':'dashboard'; render(); } break;
    case 'consentContinue': if(state.consentChecked){ state.screen='dashboard'; render(); } break;
    case 'goBack': state.screen='login'; render(); break;
    case 'vark': {
      const tp=el.dataset.type; const na=[...state.varkAnswers,tp];
      if(na.length>=VARK_QS.length){ state.varkAnswers=na; state.varkDone=true; }
      else { state.varkAnswers=na; state.varkStep++; }
      render(); break;
    }
    case 'varkContinue': state.screen='dashboard'; render(); break;
    case 'nav': state.screen=el.dataset.screen; render(); break;
    case 'logout': Object.assign(state,{screen:'login',role:null,consentChecked:false,varkStep:0,varkAnswers:[],varkDone:false,selectedKgNode:null}); render(); break;
    case 'chatSend': sendChat(); break;
    case 'suggest': state.chatInput=el.dataset.label; sendChat(); break;
  }
});

document.addEventListener('change', e=>{
  if(e.target.dataset.action==='consentToggle'){ state.consentChecked=e.target.checked; render(); }
});

document.addEventListener('input', e=>{
  const a=e.target.dataset.action;
  if(a==='email'){ state.email=e.target.value; const b=document.getElementById('login-btn'); if(b) b.style.opacity=(state.role&&state.email)?'1':'0.5'; }
  else if(a==='password'){ state.password=e.target.value; }
  else if(a==='chat'){ state.chatInput=e.target.value; const b=document.getElementById('send-btn'); if(b) b.style.opacity=state.chatInput.trim()?'1':'0.4'; e.target.style.height='auto'; e.target.style.height=Math.min(e.target.scrollHeight,120)+'px'; }
});

document.addEventListener('keydown', e=>{
  if(e.target.dataset.action==='chat' && e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendChat(); }
});

render();
</script>
</body>
</html>
